apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-ingress
  namespace: library-app
  annotations:
    kubernetes.io/ingress.class: alb
spec:
  rules:
  - host: library.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: library-service
            port:
              number: 80
