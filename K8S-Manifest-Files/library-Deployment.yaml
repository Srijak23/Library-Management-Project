apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-deployment
  labels:
    app: library
spec:
  replicas: 3
  selector:
    matchLabels:
      app: library
  template:
    metadata:
      labels:
        app: library
    spec:
      containers:
      - name: library-frontend
        image: sreeja026/libraryimage:v1
        ports:
        - containerPort: 3000
        env:
        - name: MONGO_URI
          value: "mongodb://localhost:27017/libraryDB"
        - name: DB_NAME
          value: "libraryDB"

      - name: library-mongo
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db

      volumes:
      - name: mongo-storage
        emptyDir: {}
